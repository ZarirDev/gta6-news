name: GTA6 Recomp blog monitor

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce scheduling delays.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta6recomp-blog-monitor
  cancel-in-progress: false

jobs:
  check-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Check blog and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_NAME: GTA6 Recomp Blog Alerts
          CHECK_INTERVAL: 5m
          RUN_ONCE: '1'
          STATE_FILE: monitor.json
        run: go run ./gta6recomp-monitor.go

      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update blog monitor state [skip ci]"
            git push
          else
            echo "No state changes to save."
          fi
